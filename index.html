<!doctype html>
<html lang="en">
  <head>
    <meta
      name="google-site-verification"
      content="y0s_GsSJnKW7nQicBVIGViPtYEdn-eydEeL4Kmn63r0"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="preload"
      href="/fonts/roboto-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/roboto-latin-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/roboto-latin-400.woff2") format("woff2");
      }

      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/roboto-latin-500.woff2") format("woff2");
      }

      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/roboto-latin-700.woff2") format("woff2");
      }

      @font-face {
        font-family: "Roboto Mono";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/roboto-mono-latin-500.woff2") format("woff2");
      }

      /* Overrides match Roboto's metrics (ascent 1900, descent 500, 2048 units per em) on Arial, so swapping fonts doesn't shift layout. */
      @font-face {
        font-family: "Roboto Fallback";
        src: local("Arial");
        size-adjust: 100.3%;
        ascent-override: 92.49%;
        descent-override: 24.34%;
        line-gap-override: 0%;
      }
    </style>

    <script>
      (() => {
        const theme =
          localStorage.getItem("theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!--injected-meta-tags-->

    <!--injected-styles-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
